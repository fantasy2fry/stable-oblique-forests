[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-oblique-forests"
version = "0.1.0"
description = "Research implementation of node-wise stability regularization in sparse oblique random forests"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Research implementation"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.6,<2",
    "joblib>=1.3",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7", "build>=1"]
experiments = [
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 99
